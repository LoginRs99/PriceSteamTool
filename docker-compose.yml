version: '3.8'

services:
  pricetool:
    image: ghcr.io/loginrs99/pricesteamtool:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricetool
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/data
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - ITAD_API_KEY=${ITAD_API_KEY:-}
      - GGDEALS_API_KEY=${GGDEALS_API_KEY:-}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-6}
      - AUTO_SYNC_ENABLED=${AUTO_SYNC_ENABLED:-true}
      - AUTO_SYNC_INTERVAL_HOURS=${AUTO_SYNC_INTERVAL_HOURS:-6}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-365}
      - STEAM_DELAY_MS=${STEAM_DELAY_MS:-1500}
      - ITAD_DELAY_MS=${ITAD_DELAY_MS:-500}
      - CHEAPSHARK_DELAY_MS=${CHEAPSHARK_DELAY_MS:-500}
      - GGDEALS_DELAY_MS=${GGDEALS_DELAY_MS:-1000}
      - ALLKEYSHOP_DELAY_MS=${ALLKEYSHOP_DELAY_MS:-3500}
      - ALLKEYSHOP_JITTER_MS=${ALLKEYSHOP_JITTER_MS:-2000}
      - ALLKEYSHOP_CHUNK_SIZE=${ALLKEYSHOP_CHUNK_SIZE:-30}
      - ALLKEYSHOP_CHUNK_PAUSE_MS=${ALLKEYSHOP_CHUNK_PAUSE_MS:-45000}
      - ALLKEYSHOP_MAX_GAMES=${ALLKEYSHOP_MAX_GAMES:-0}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_ENABLED=${DISCORD_ENABLED:-}
      - DISCORD_MIN_DEAL_SCORE=${DISCORD_MIN_DEAL_SCORE:-75}
      - DISCORD_MIN_CONFIDENCE=${DISCORD_MIN_CONFIDENCE:-40}
      - DISCORD_NOTIFY_ATL_ONLY=${DISCORD_NOTIFY_ATL_ONLY:-false}
      - DISCORD_NOTIFY_FREE_GAMES=${DISCORD_NOTIFY_FREE_GAMES:-true}
      - DISCORD_COOLDOWN_HOURS=${DISCORD_COOLDOWN_HOURS:-24}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
